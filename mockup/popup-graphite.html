<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>keeptidy — popup · graphite</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Funnel+Sans:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-1: #f6f6f3;
    --bg-2: #ececea;
    --ink: #14141a;
    --ink-2: #56565a;
    --ink-3: #9a9a98;
    --rule: #e0e0dd;
    --rule-2: #c9c9c4;
    --panel: #ffffff;
    --lime: #c8ff00;
    --lime-2: #aede12;
    --lime-deep: #6f8a00;
    --red: #ff3a21;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #1c1c20;
    font-family: "Funnel Sans", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.003em;
    min-height: 100vh;
  }

  /* stage backdrop — to show the popup as if floating from a browser toolbar */
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 20px;
    background:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(200,255,0,0.04), transparent 60%),
      linear-gradient(180deg, #1c1c20, #131316);
  }

  .frame-label {
    position: absolute;
    top: 14px; left: 50%; transform: translateX(-50%);
    color: #6a6a72;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  }

  /* POPUP */
  .popup {
    width: 380px;
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    color: var(--ink);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 18px 30px -12px rgba(0,0,0,0.4);
  }

  /* fine dot grid texture */
  .popup::before {
    content: "";
    position: absolute; inset: 0; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='20' height='20'%3E%3Ccircle cx='1' cy='1' r='0.55' fill='%2314141a' opacity='0.16'/%3E%3C/svg%3E");
    background-size: 20px 20px;
  }

  /* lime hairline along the top */
  .popup::after {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--lime) 50%, transparent);
    z-index: 3;
  }

  .popup > * { position: relative; z-index: 2; }

  /* HEADER */
  .head {
    padding: 16px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--rule);
  }
  .wordmark {
    display: flex; align-items: baseline; gap: 8px;
  }
  .wordmark h1 {
    font-family: "Funnel Display", sans-serif;
    font-size: 22px; font-weight: 300; letter-spacing: -0.04em; line-height: 1;
  }
  .wordmark h1 em { font-style: normal; font-weight: 700; }
  .wordmark h1 em::after { content: "."; color: var(--lime-deep); }
  .wordmark .v {
    font-family: "JetBrains Mono", monospace; font-size: 9px;
    letter-spacing: 0.18em; color: var(--ink-3); text-transform: uppercase;
    padding-bottom: 2px;
  }

  .status {
    display: flex; align-items: center; gap: 8px;
    font-family: "JetBrains Mono", monospace; font-size: 9.5px;
    letter-spacing: 0.16em; color: var(--ink); text-transform: uppercase;
    font-weight: 500;
  }
  .status .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--lime);
    box-shadow: 0 0 0 3px rgba(200,255,0,0.3), 0 0 6px rgba(200,255,0,0.6);
  }

  /* HERO — big number */
  .hero {
    padding: 22px 20px 18px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 14px;
  }
  .hero .left { display: flex; flex-direction: column; gap: 4px; }
  .hero .eyebrow {
    font-family: "JetBrains Mono", monospace; font-size: 9px;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3);
  }
  .hero .count {
    font-family: "Funnel Display", sans-serif;
    font-size: 62px; font-weight: 300; line-height: 0.9;
    letter-spacing: -0.05em; color: var(--ink);
    display: flex; align-items: baseline; gap: 8px;
  }
  .hero .count em { font-weight: 700; font-style: normal; }
  .hero .right {
    text-align: right;
    display: flex; flex-direction: column; gap: 4px;
    padding-bottom: 6px;
  }
  .hero .right .k {
    font-family: "JetBrains Mono", monospace; font-size: 9px;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-3);
  }
  .hero .right .v {
    font-family: "Funnel Display", sans-serif; font-size: 18px;
    font-weight: 500; line-height: 1; color: var(--ink);
    letter-spacing: -0.02em;
  }

  /* MINI TIMELINE */
  .mini-tl {
    margin: 4px 20px 18px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 14px 14px 10px;
    position: relative;
  }
  .mini-tl .label {
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 9px;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3);
    margin-bottom: 8px;
  }
  .mini-tl .label .now { color: var(--ink); font-weight: 500; }

  .mini-tl-svg {
    width: 100%; height: 38px; display: block; overflow: visible;
  }

  .mini-tl .ticks {
    display: flex; justify-content: space-between;
    font-family: "JetBrains Mono", monospace; font-size: 8px;
    letter-spacing: 0.06em; color: var(--ink-3);
    margin-top: 4px;
  }
  .mini-tl .ticks .now { color: var(--ink); font-weight: 500; }

  /* PRIMARY CTA */
  .primary {
    margin: 0 20px;
    width: calc(100% - 40px);
    padding: 14px 18px;
    background: var(--ink);
    color: var(--lime);
    border: none;
    border-radius: 4px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase;
    cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    transition: transform 0.12s ease, background 0.18s ease;
    box-shadow: 0 8px 18px -6px rgba(20,20,26,0.5);
  }
  .primary:hover { transform: translateY(-1px); }
  .primary .pcount {
    font-family: "Funnel Display", sans-serif;
    font-size: 18px; font-weight: 700; letter-spacing: -0.02em;
    color: var(--lime); text-transform: none;
  }
  .primary .arrow { font-family: "Funnel Sans", sans-serif; font-size: 16px; color: var(--lime); }

  /* THRESHOLD PILLS */
  .pill-label {
    display: flex; align-items: center; gap: 10px;
    margin: 22px 20px 10px;
    font-family: "JetBrains Mono", monospace; font-size: 9px;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3);
  }
  .pill-label::after {
    content: ""; flex: 1; height: 1px; background: var(--rule);
  }

  .pills {
    margin: 0 20px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
  }
  .pill {
    padding: 9px 6px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 3px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; color: var(--ink-2);
    cursor: pointer; text-align: center;
    transition: all 0.15s ease;
  }
  .pill:hover { border-color: var(--ink); color: var(--ink); }
  .pill.on {
    background: var(--ink); color: var(--lime);
    border-color: var(--ink); font-weight: 500;
    box-shadow: 0 4px 10px -4px rgba(20,20,26,0.3);
  }

  /* AUTO TIDY ROW */
  .row {
    margin: 18px 20px 0;
    padding: 14px 0;
    border-top: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .row .label-stack { display: flex; flex-direction: column; gap: 2px; }
  .row .label-stack .label { font-size: 13px; color: var(--ink); font-weight: 500; }
  .row .label-stack .sub {
    font-family: "JetBrains Mono", monospace; font-size: 9.5px;
    color: var(--ink-3); letter-spacing: 0.04em;
  }

  /* toggle */
  .switch {
    position: relative;
    width: 42px; height: 22px;
    background: var(--bg-2);
    border: 1px solid var(--rule-2);
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
    flex-shrink: 0;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 1px; left: 1px;
    width: 18px; height: 18px;
    background: var(--ink);
    border-radius: 50%;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .switch.on {
    background: var(--ink);
    border-color: var(--ink);
  }
  .switch.on::after {
    background: var(--lime);
    transform: translateX(20px);
    box-shadow: 0 0 0 2px var(--ink), 0 0 8px rgba(200,255,0,0.5);
  }

  /* FOOTER */
  .foot {
    margin-top: 16px;
    padding: 12px 20px 14px;
    border-top: 1px solid var(--rule);
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.025));
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .foot a {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink); text-decoration: none;
    display: flex; align-items: center; gap: 6px;
    transition: color 0.15s ease;
  }
  .foot a::after { content: "→"; transition: transform 0.18s ease; }
  .foot a:hover { color: var(--lime-deep); }
  .foot a:hover::after { transform: translateX(3px); }
  .foot .ver {
    font-family: "JetBrains Mono", monospace; font-size: 9px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
  }
</style>
</head>
<body>
  <div class="frame-label">popup · 380 × auto · graphite</div>

  <div class="popup">

    <!-- HEAD -->
    <header class="head">
      <div class="wordmark">
        <h1>keep<em>tidy</em></h1>
        <span class="v">v0.1</span>
      </div>
      <div class="status">
        <span class="dot"></span>
        <span>auto on</span>
      </div>
    </header>

    <!-- HERO -->
    <section class="hero">
      <div class="left">
        <div class="eyebrow">pending removal</div>
        <div class="count"><em>1,247</em></div>
      </div>
      <div class="right">
        <span class="k">threshold</span>
        <span class="v">2 months</span>
      </div>
    </section>

    <!-- MINI TIMELINE -->
    <section class="mini-tl">
      <div class="label">
        <span>timeline</span>
        <span class="now">last sweep · 3d ago · 874</span>
      </div>
      <svg class="mini-tl-svg" viewBox="0 0 340 38" preserveAspectRatio="none">
        <defs>
          <linearGradient id="popPruned" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#14141a" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#14141a" stop-opacity="0.16"/>
          </linearGradient>
          <linearGradient id="popKept" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#c8ff00" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#c8ff00" stop-opacity="0.1"/>
          </linearGradient>
        </defs>

        <!-- regions -->
        <rect x="0" y="10" width="240" height="18" fill="url(#popPruned)"/>
        <rect x="240" y="10" width="100" height="18" fill="url(#popKept)"/>

        <!-- axis -->
        <line x1="0" y1="19" x2="340" y2="19" stroke="#14141a" stroke-opacity="0.5" stroke-width="0.8"/>

        <!-- tick marks -->
        <g stroke="#14141a" stroke-opacity="0.35" stroke-width="0.8">
          <line x1="20"  y1="19" x2="20"  y2="22"/>
          <line x1="80"  y1="19" x2="80"  y2="22"/>
          <line x1="140" y1="19" x2="140" y2="22"/>
          <line x1="200" y1="19" x2="200" y2="22"/>
          <line x1="240" y1="19" x2="240" y2="22"/>
          <line x1="280" y1="19" x2="280" y2="22"/>
          <line x1="310" y1="19" x2="310" y2="22"/>
          <line x1="340" y1="19" x2="340" y2="24" stroke-opacity="1" stroke-width="1.5"/>
        </g>

        <!-- past sweep dots -->
        <g fill="#14141a" opacity="0.7">
          <circle cx="335" cy="31" r="1.5"/>
          <circle cx="328" cy="31" r="1.5"/>
          <circle cx="321" cy="31" r="1.5"/>
          <circle cx="312" cy="31" r="1.3"/>
          <circle cx="300" cy="31" r="1.3"/>
          <circle cx="288" cy="31" r="1.3"/>
          <circle cx="275" cy="31" r="1.3"/>
          <circle cx="262" cy="31" r="1.2"/>
          <circle cx="250" cy="31" r="1.2"/>
        </g>

        <!-- threshold marker -->
        <line x1="240" y1="4" x2="240" y2="32" stroke="#14141a" stroke-width="1" stroke-dasharray="2,2"/>
        <circle cx="240" cy="19" r="4.5" fill="#c8ff00" stroke="#14141a" stroke-width="1.2"/>

        <!-- now marker -->
        <circle cx="340" cy="19" r="3.5" fill="#14141a"/>
      </svg>
      <div class="ticks">
        <span>1 yr</span>
        <span>6 mo</span>
        <span>3 mo</span>
        <span>1 mo</span>
        <span style="color:var(--ink);font-weight:500">2 mo ◆</span>
        <span>2 w</span>
        <span>1 w</span>
        <span class="now">today</span>
      </div>
    </section>

    <!-- PRIMARY -->
    <button class="primary">
      <span>Tidy now</span>
      <span class="pcount">1,247 <span class="arrow">→</span></span>
    </button>

    <!-- THRESHOLD PILLS -->
    <div class="pill-label">threshold</div>
    <div class="pills">
      <button class="pill">1d</button>
      <button class="pill">1w</button>
      <button class="pill">2w</button>
      <button class="pill">1mo</button>
      <button class="pill on">2mo</button>
    </div>

    <!-- AUTO TIDY -->
    <div class="row">
      <div class="label-stack">
        <span class="label">Auto-tidy</span>
        <span class="sub">runs daily · 03:00 local</span>
      </div>
      <div class="switch on"></div>
    </div>

    <!-- FOOTER -->
    <footer class="foot">
      <a href="settings-4d-graphite.html">Open settings</a>
      <span class="ver">build 0.1.0</span>
    </footer>

  </div>
</body>
</html>
